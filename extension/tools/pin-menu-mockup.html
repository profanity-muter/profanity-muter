<title>Pin it mockup</title>
<!--
  tools/pin-menu-mockup.html  (0.1.56, second pass)

  Source for onboarding/pin-menu.png, the picture in the "Pin it" step.

  WHY THIS IS A DRAWING AND NOT A SCREENSHOT. A real screenshot of a Chrome
  extensions menu carries whatever else is in that toolbar: other vendors'
  icons and names, a profile photo, a browser's own UI as shipped. That is
  third-party material inside a Chrome Web Store package, and it also dates
  the moment Chrome changes its chrome. So the menu is redrawn from scratch,
  the neighbours are generic grey placeholders, and the only real artwork in
  it is our own icon. It is also a drawing that can be re-rendered in the
  onboarding palette rather than clashing with it.

  RE-RENDER (requires Playwright, e.g. the copy in ~/Desktop/niche-sites):

    node -e "
    import('/Users/nathanaeldesmond2026/Desktop/niche-sites/node_modules/playwright/index.mjs')
    .then(async ({chromium}) => {
      const b = await chromium.launch({channel:'chromium'});
      const c = await b.newContext({viewport:{width:760,height:430},deviceScaleFactor:2});
      const p = await c.newPage();
      await p.setContent(require('fs').readFileSync('tools/pin-menu-mockup.html','utf8'));
      await p.screenshot({path:'onboarding/pin-menu.png',clip:{x:0,y:0,width:760,height:430}});
      await b.close();
    })"

  Palette is onboarding.css: ink #1d2f54, gold #e8c46c, paper #faf8f2.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 760px; height: 430px; }
  body {
    background: #faf8f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1d2f54;
    position: relative;
    overflow: hidden;
  }

  /* ---- the browser window, top-right corner of ---- */
  .win {
    position: absolute;
    top: 26px; left: 26px; right: 26px;
    height: 118px;
    background: #dee1e6;
    border-radius: 12px 12px 0 0;
    border: 1px solid #c7ccd4;
    border-bottom: none;
    overflow: hidden;
  }
  .tabrow { height: 40px; position: relative; }
  .tab {
    position: absolute; left: 14px; top: 8px;
    width: 220px; height: 32px;
    background: #fff; border-radius: 8px 8px 0 0;
  }
  .tab::after {
    content: ""; position: absolute; left: 14px; top: 12px;
    width: 120px; height: 8px; border-radius: 4px; background: #d5d8de;
  }
  .toolbar {
    height: 78px; background: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 0 18px;
  }
  .omni {
    flex: 1; height: 40px; border-radius: 20px;
    background: #f1f3f4;
    position: relative;
  }
  .omni::after {
    content: ""; position: absolute; left: 22px; top: 16px;
    width: 46%; height: 8px; border-radius: 4px; background: #d5d8de;
  }
  .tbtn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .tbtn svg { width: 22px; height: 22px; fill: #5f6368; }
  /* The puzzle piece is the control step i. names, so it is ringed in gold
     and everything around it stays grey. */
  .puzzle {
    background: #fff8e6;
    box-shadow: 0 0 0 3px #e8c46c;
  }
  .puzzle svg { fill: #1d2f54; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #b9bfce; flex: none;
  }
  .dots { display: flex; flex-direction: column; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: #5f6368; }

  /* ---- the Extensions dropdown ---- */
  .menu {
    position: absolute;
    top: 150px; right: 92px;
    width: 340px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(29,47,84,0.22), 0 2px 6px rgba(29,47,84,0.12);
    border: 1px solid #e4dfd2;
    padding: 10px 0 8px;
  }
  .menu::before {
    content: ""; position: absolute; top: -8px; right: 28px;
    width: 16px; height: 16px; background: #fff;
    border-left: 1px solid #e4dfd2; border-top: 1px solid #e4dfd2;
    transform: rotate(45deg);
  }
  .menu h3 {
    font-size: 14px; font-weight: 600; color: #1d2f54;
    padding: 6px 16px 10px;
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 14px;
  }
  .row .dot { width: 24px; height: 24px; border-radius: 50%; background: #d5d8de; flex: none; }
  .row .name { flex: 1; font-size: 13.5px; color: #56617e; }
  .row .pin svg { width: 18px; height: 18px; fill: #b9bfce; }
  .row .pin { width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex: none; }

  /* Our row: the one the user is looking for, so it is the only one with
     ink-coloured type and a raised background. */
  .row--ours {
    background: #f4f1e7;
    border-top: 1px solid #efe9db;
    border-bottom: 1px solid #efe9db;
  }
  .row--ours .name { color: #1d2f54; font-weight: 600; }
  .row--ours img { width: 24px; height: 24px; border-radius: 5px; flex: none; }
  .row--ours .pin {
    background: #fff8e6;
    box-shadow: 0 0 0 3px #e8c46c;
  }
  .row--ours .pin svg { fill: #1d2f54; }

  /* ---- the two numbered callouts, matching i. and ii. ---- */
  .num {
    position: absolute;
    width: 30px; height: 30px; border-radius: 50%;
    background: #1d2f54; color: #e8c46c;
    font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(29,47,84,0.35);
  }
  .num--1 { top: 62px; right: 150px; }
  /* Level with the Profanity Muter row, just outside the menu, so it reads
     as pointing at that row's pin rather than at the row below it. */
  .num--2 { top: 284px; right: 60px; }
</style>
